<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <link rel="stylesheet" href="/assets/style/signupstyle.css">
</head>
<body>

   <div class="dual">

   <div class="dual-media" role="img" aria-label="Team collaborating around a laptop in an office"></div>

   <section class="dual-form">
    <div class="form-card">
      <h1>Sign Up</h1>

      <form action="#" method="post">
        <div class="field">
          <label for="fullname">Full Name</label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            <input id="fullname" name="fullname" type="text" placeholder="Full Name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 6 8 7 8-7"/></svg>
            <input id="email" name="email" type="email" placeholder="Email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" placeholder="Password" required>
            <button class="toggle-visibility" type="button" aria-label="Show password">
              <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path d="m4 4 16 16"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-primary" type="submit">Create Account</button>

        <p class="form-links">Already have an account? <a href="signin.html">Sign In</a></p>
      </form>
    </div>
  </section>

</div>

</body>
</html>
